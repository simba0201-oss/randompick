<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청소 당번 뽑기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --surface: #fffdf7;
    --accent: #2d5016;
    --accent2: #7ab648;
    --text: #1a1a1a;
    --text-muted: #6b6b5a;
    --border: #d4cdb8;
    --excluded-bg: #e8e4d8;
    --excluded-text: #aaa89a;
    --winner-bg: #eaf5d8;
    --winner-border: #7ab648;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Gowun Dodum', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(122,182,72,0.08) 0%, transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(45,80,22,0.06) 0%, transparent 50%);
  }

  header {
    text-align: center;
    padding: 3rem 1rem 2rem;
  }

  .logo {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: var(--accent);
    letter-spacing: -1px;
    line-height: 1;
  }

  .logo span {
    color: var(--accent2);
  }

  .logo-sub {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 8px;
    letter-spacing: 2px;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 1.25rem 4rem;
  }

  .panel {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 1.75rem;
    margin-bottom: 1.25rem;
  }

  .panel-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  /* 학생 그리드 */
  .name-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
  }

  .name-btn {
    font-family: 'Gowun Dodum', serif;
    font-size: 13px;
    padding: 9px 4px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .name-btn:hover {
    border-color: var(--accent2);
    transform: translateY(-1px);
  }

  .name-btn.excluded {
    background: var(--excluded-bg);
    color: var(--excluded-text);
    text-decoration: line-through;
    border-style: dashed;
    border-color: var(--excluded-text);
    transform: none;
  }

  .name-btn.winner {
    background: var(--winner-bg);
    border-color: var(--winner-border);
    color: var(--accent);
    font-weight: bold;
    animation: pop 0.3s ease;
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  /* 이름 편집 */
  .edit-area {
    width: 100%;
    min-height: 120px;
    font-family: 'Gowun Dodum', serif;
    font-size: 14px;
    line-height: 1.9;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    background: var(--bg);
    color: var(--text);
    resize: vertical;
    display: none;
  }

  .edit-area:focus { outline: none; border-color: var(--accent2); }

  .edit-toggle {
    font-family: 'Gowun Dodum', serif;
    font-size: 13px;
    color: var(--text-muted);
    background: none;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.15s;
  }

  .edit-toggle:hover { border-color: var(--accent2); color: var(--accent); }

  /* 컨트롤 */
  .controls-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .count-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .count-label { font-size: 15px; color: var(--text-muted); }

  .count-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--bg);
    font-size: 18px;
    color: var(--accent);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .count-btn:hover { border-color: var(--accent2); background: var(--winner-bg); }

  .count-display {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 28px;
    color: var(--accent);
    min-width: 48px;
    text-align: center;
  }

  .avail-badge {
    margin-left: auto;
    font-size: 13px;
    color: var(--text-muted);
    background: var(--excluded-bg);
    padding: 5px 12px;
    border-radius: 999px;
  }

  /* 뽑기 버튼 */
  .pick-btn {
    width: 100%;
    padding: 18px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.18s;
    margin-bottom: 1.25rem;
    position: relative;
    overflow: hidden;
  }

  .pick-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.08) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.4s;
  }

  .pick-btn:hover { background: #3a6b1e; transform: translateY(-2px); }
  .pick-btn:hover::after { transform: translateX(100%); }
  .pick-btn:active { transform: translateY(0) scale(0.99); }
  .pick-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }

  /* 결과 */
  .result-panel {
    background: var(--surface);
    border: 2px solid var(--winner-border);
    border-radius: 20px;
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    display: none;
    animation: fadeIn 0.4s ease;
  }

  .result-panel.show { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 8px;
  }

  .result-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 18px;
    color: var(--accent);
  }

  .result-date {
    font-size: 12px;
    color: var(--text-muted);
  }

  .winner-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .winner-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--winner-bg);
    border: 1.5px solid var(--winner-border);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 15px;
    color: var(--accent);
    font-weight: bold;
    animation: popIn 0.3s ease both;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  .winner-num-badge {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 11px;
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
  }

  /* 기록 */
  .history-item {
    display: flex;
    gap: 12px;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }

  .history-item:last-child { border-bottom: none; }

  .history-date { color: var(--text-muted); font-size: 12px; min-width: 80px; }
  .history-names { color: var(--text); line-height: 1.6; }

  .reset-btn {
    font-family: 'Gowun Dodum', serif;
    font-size: 13px;
    color: var(--text-muted);
    background: none;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.15s;
  }

  .reset-btn:hover { border-color: #c0392b; color: #c0392b; }

  .empty-history {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    padding: 16px 0;
  }

  /* 제외 안내 */
  .hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* 반응형 */
  @media (max-width: 480px) {
    .name-grid { grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); }
    .logo { font-size: 2rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">청소<span>당번</span> 뽑기</div>
  <p class="logo-sub">오늘의 청소 담당자를 공정하게 선발</p>
</header>

<div class="container">

  <!-- 학생 명단 -->
  <div class="panel">
    <p class="panel-title">학생 명단</p>
    <div class="name-grid" id="nameGrid"></div>
    <p class="hint">이름을 클릭하면 결석·제외 처리됩니다</p>
    <button class="edit-toggle" id="editToggle" onclick="toggleEdit()">✏️ 명단 편집</button>
    <textarea class="edit-area" id="editArea" placeholder="한 줄에 한 명씩 입력하세요"></textarea>
    <button class="edit-toggle" id="applyBtn" style="display:none; border-color: var(--accent2); color: var(--accent);" onclick="applyEdit()">✔ 적용하기</button>
  </div>

  <!-- 컨트롤 -->
  <div class="panel">
    <p class="panel-title">뽑을 인원 설정</p>
    <div class="controls-row">
      <div class="count-group">
        <button class="count-btn" onclick="changeCount(-1)">−</button>
        <div class="count-display" id="countDisplay">5</div>
        <button class="count-btn" onclick="changeCount(1)">+</button>
      </div>
      <span style="font-size:15px; color:var(--text-muted);">명 뽑기</span>
      <span class="avail-badge" id="availBadge">참여 가능 29명</span>
    </div>
  </div>

  <!-- 뽑기 버튼 -->
  <button class="pick-btn" id="pickBtn" onclick="pickWinners()">🎲 청소 당번 뽑기</button>

  <!-- 결과 -->
  <div class="result-panel" id="resultPanel">
    <div class="result-header">
      <p class="result-title">🧹 오늘의 청소 당번</p>
      <span class="result-date" id="resultDate"></span>
    </div>
    <div class="winner-chips" id="winnerChips"></div>
  </div>

  <!-- 기록 -->
  <div class="panel">
    <p class="panel-title">뽑기 기록</p>
    <div id="historyList"><p class="empty-history">아직 기록이 없습니다</p></div>
    <button class="reset-btn" onclick="resetHistory()">기록 초기화</button>
  </div>

</div>

<script>
let students = [
  "강민준","강서연","김도윤","김민서","김소율",
  "김지우","나예린","류하준","박건우","박나연",
  "박지호","서민아","서하은","송예준","신도현",
  "오수아","오지민","윤채원","이다은","이서준",
  "이수빈","이지안","임현우","장나은","정우진",
  "정하윤","조민서","최예원","한도윤"
];

let excluded = new Set();
let lastWinners = new Set();
let count = 5;
let history = JSON.parse(localStorage.getItem('cleanHistory') || '[]');
let editMode = false;

function renderNames() {
  const grid = document.getElementById('nameGrid');
  grid.innerHTML = '';
  students.forEach((name, i) => {
    const btn = document.createElement('button');
    let cls = 'name-btn';
    if (excluded.has(i)) cls += ' excluded';
    else if (lastWinners.has(i)) cls += ' winner';
    btn.className = cls;
    btn.textContent = name;
    btn.onclick = () => {
      if (excluded.has(i)) excluded.delete(i);
      else excluded.add(i);
      lastWinners.clear();
      renderNames();
      updateAvail();
    };
    grid.appendChild(btn);
  });
}

function updateAvail() {
  const avail = students.length - excluded.size;
  document.getElementById('availBadge').textContent = `참여 가능 ${avail}명`;
  document.getElementById('countDisplay').textContent = count;
  document.getElementById('pickBtn').disabled = count > avail;
}

function changeCount(delta) {
  const avail = students.length - excluded.size;
  count = Math.max(1, Math.min(avail, count + delta));
  updateAvail();
}

function pickWinners() {
  const pool = students.map((n, i) => ({ n, i })).filter(x => !excluded.has(x.i));
  if (count > pool.length) { alert('참여 가능 인원이 부족해요!'); return; }

  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const winners = shuffled.slice(0, count);

  lastWinners = new Set(winners.map(w => w.i));
  renderNames();

  const chips = document.getElementById('winnerChips');
  chips.innerHTML = '';
  winners.forEach((w, i) => {
    const chip = document.createElement('div');
    chip.className = 'winner-chip';
    chip.style.animationDelay = (i * 80) + 'ms';
    chip.innerHTML = `<span class="winner-num-badge">${i+1}</span>${w.n}`;
    chips.appendChild(chip);
  });

  const now = new Date();
  const dateStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  document.getElementById('resultDate').textContent = dateStr;
  document.getElementById('resultPanel').classList.add('show');

  const record = { date: dateStr, names: winners.map(w => w.n) };
  history.unshift(record);
  localStorage.setItem('cleanHistory', JSON.stringify(history.slice(0, 30)));
  renderHistory();
}

function renderHistory() {
  const hl = document.getElementById('historyList');
  if (!history.length) { hl.innerHTML = '<p class="empty-history">아직 기록이 없습니다</p>'; return; }
  hl.innerHTML = '';
  history.slice(0, 15).forEach(h => {
    const row = document.createElement('div');
    row.className = 'history-item';
    row.innerHTML = `<span class="history-date">${h.date}</span><span class="history-names">${h.names.join(', ')}</span>`;
    hl.appendChild(row);
  });
}

function resetHistory() {
  if (!confirm('기록을 모두 삭제할까요?')) return;
  history = [];
  localStorage.removeItem('cleanHistory');
  renderHistory();
}

function toggleEdit() {
  editMode = !editMode;
  const area = document.getElementById('editArea');
  const applyBtn = document.getElementById('applyBtn');
  const toggle = document.getElementById('editToggle');
  if (editMode) {
    area.value = students.join('\n');
    area.style.display = 'block';
    applyBtn.style.display = 'inline-block';
    toggle.textContent = '✖ 취소';
  } else {
    area.style.display = 'none';
    applyBtn.style.display = 'none';
    toggle.textContent = '✏️ 명단 편집';
  }
}

function applyEdit() {
  const lines = document.getElementById('editArea').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) { alert('최소 1명 이상 입력해주세요.'); return; }
  students = lines;
  excluded.clear();
  lastWinners.clear();
  count = Math.min(count, students.length);
  renderNames();
  updateAvail();
  toggleEdit();
}

renderNames();
updateAvail();
renderHistory();
</script>
</body>
</html>
